.memo-field textarea{display:block;width:100%;min-width:0;min-height:124px;padding:14px 15px;border:1px solid #e1e5e3;border-radius:12px;background:#fdfdfc;color:#313a3c;font:inherit;font-size:13px;line-height:1.75;resize:vertical;outline:none;overflow-wrap:anywhere}
.memo-field textarea::placeholder{color:#aab1b0}
.memo-field textarea:focus{border-color:#9facde;background:#fff;box-shadow:0 0 0 3px #cbd6fa56}
.memo-caution{font-size:10px;color:#959b9b;margin:16px 0 0;line-height:1.55}
.memo-detail-card .memo-detail-heading{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.memo-detail-card .memo-detail-heading h3{margin:0;font-size:17px}
.memo-detail-heading span{font-size:9px;letter-spacing:.12em;color:#a2a8a6;font-weight:850}
.memo-entry+.memo-entry{margin-top:22px;padding-top:20px;border-top:1px solid #eceeeb}
.memo-label{display:inline-flex;align-items:center;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:850}
.memo-label.issue{background:#fff0f4;color:#af5b78}
.memo-label.thoughts{background:#eeeffb;color:#626b9f}
.memo-body{margin:11px 0 0;color:#424c50;font-size:13px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.memo-empty{margin:0;color:#989f9e;font-size:12px}
@media(max-width:650px){
 .memo-editor-card{padding-bottom:20px}
 .memo-lead{font-size:11px;margin-bottom:16px}
 .memo-fields{gap:16px}
 .memo-field textarea{font-size:16px;line-height:1.65;min-height:134px;padding:12px 13px;border-radius:11px}
 .memo-detail-card .memo-detail-heading{margin-bottom:16px}
 .memo-detail-card .memo-detail-heading h3{font-size:15px}
 .memo-body{font-size:12px;line-height:1.8}
}

/* Official X account: show the brand mark rather than a printed URL. */
.official-x-field{margin:17px 0 0;max-width:100%}
.official-x-field .field{max-width:100%}
.official-x-field .note{margin-top:7px;line-height:1.55}
.official-x-field+.entry-row{margin-top:24px;padding-top:24px;border-top:1px solid var(--line)}
.detail-sub-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:6px;min-width:0}
.detail-sub-row .detail-sub{min-width:0;overflow-wrap:anywhere}
.official-x-link{display:inline-flex;justify-content:center;align-items:center;flex:0 0 35px;width:35px;height:35px;border-radius:10px;background:#17191d;color:#fff;box-shadow:0 4px 13px rgba(0,0,0,.10);transition:transform .16s,background .16s}
.official-x-link:hover{background:#34383d;transform:translateY(-1px)}
.official-x-link svg{width:18px;height:18px;display:block}
@media(max-width:650px){
 .official-x-field{margin-top:15px}
 .official-x-field+.entry-row{margin-top:20px;padding-top:20px}
 .official-x-field .field input{font-size:16px}
 .official-x-field .note{font-size:10px;line-height:1.55}
 .official-x-link{height:34px;width:34px;flex-basis:34px;border-radius:9px}
}

/* Album performance metrics */
.metrics-inputs{margin-top:14px}
.metric-refresh{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.metric-refresh .secondary-btn{font-size:12px}
.metric-refresh .note{margin:9px 0 0;line-height:1.65}
.album-metrics{margin-top:18px}
.album-metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.album-metric{background:#f7f8f8;padding:15px;border-radius:12px;min-width:0}
.album-metric span{display:block;font-size:11px;color:#7f868b;margin-bottom:7px}
.album-metric strong{font-size:17px;overflow-wrap:anywhere;letter-spacing:-.025em}
.metric-date{font-size:10px;color:#8f9698;margin:12px 0 0}
@media(max-width:650px){.album-metric{padding:12px}.album-metric strong{font-size:15px}.metrics-inputs{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.metrics-inputs .field{grid-column:auto}.metric-refresh .secondary-btn{width:100%;white-space:normal}}
@media(max-width:360px){.metrics-inputs{grid-template-columns:minmax(0,1fr)}}

/* Rich memo editor: keyboard and touch-friendly bold styling, stored as safe text. */
.memo-field .memo-field-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.memo-field .memo-field-top label{margin:0}
.memo-bold-btn{flex:0 0 auto;display:grid;place-items:center;min-width:33px;min-height:32px;padding:4px 10px;border:1px solid #dedfe1;border-radius:8px;background:#f7f8f8;color:#3a4046;font-family:Georgia,serif;font-size:15px}
.memo-bold-btn:hover,.memo-bold-btn:focus-visible{border-color:#9facde;background:#eff1fc}
.memo-rich-editor{display:block;min-width:0;width:100%;min-height:136px;padding:14px 15px;border:1px solid #e1e5e3;border-radius:12px;background:#fdfdfc;color:#313a3c;font:inherit;font-size:13px;line-height:1.75;outline:none;overflow-wrap:anywhere;white-space:pre-wrap;word-break:break-word;cursor:text}
.memo-rich-editor:focus{border-color:#9facde;background:#fff;box-shadow:0 0 0 3px #cbd6fa56}
.memo-rich-editor:empty::before{content:attr(data-placeholder);color:#aab1b0;pointer-events:none}
.memo-rich-editor strong,.memo-rich-editor b,.memo-body strong{font-weight:800}
.memo-format-hint{font-size:10px;color:#919a9b;margin:7px 0 0;line-height:1.5}
@media(max-width:650px){.memo-rich-editor{min-height:141px;font-size:16px;line-height:1.65;padding:12px 13px;border-radius:11px}.memo-bold-btn{min-width:38px;min-height:36px}.memo-format-hint{font-size:10px}}

/* Compact detail typography and discreet official X mark. */
.member-display-text strong{font-size:13.5px;line-height:1.4;font-weight:800;letter-spacing:-.015em}
.member-display-text small{display:block;margin-top:5px;font-size:11.5px;line-height:1.55;color:#697477;font-weight:450}
.official-x-link{position:relative;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;padding:0;line-height:0;width:18px;height:18px;flex:0 0 18px;border-radius:5px;box-shadow:0 2px 6px rgba(0,0,0,.07)}
.official-x-link svg{position:absolute;left:50%;top:50%;display:block;width:11px;height:11px;transform:translate(-50%,-50%);margin:0;flex:none}
@media(max-width:650px){
 .member-display-text strong{font-size:13.5px;line-height:1.4}
 .member-display-text small{font-size:11.5px;line-height:1.55}
 .official-x-link{width:18px;height:18px;flex:0 0 18px;border-radius:5px}
 .official-x-link svg{width:11px;height:11px;left:50%;top:50%}
}
</style>

<body>
<header class="topbar"><div class="shell topbar-inner">
  <button class="logo" data-action="home" aria-label="홈으로 이동"><span class="logo-symbol">II</span><span class="logo-word">IDOL <span>INDEX.</span></span></button>
  <nav class="main-nav" aria-label="카테고리"><button class="nav-link" data-nav="home" data-action="home">HOME</button><button class="nav-link" data-nav="girl" data-action="category" data-type="girl">NEW GIRL GROUP</button><button class="nav-link" data-nav="boy" data-action="category" data-type="boy">NEW BOY GROUP</button><button class="nav-link" data-nav="album" data-action="category" data-type="album">NEW ALBUM</button></nav>
  <div class="header-actions"><button id="export-button" class="mini-btn admin-only hidden" data-action="export" title="사진까지 포함한 JSON 파일로 백업">↥ 백업</button><button id="import-button" class="mini-btn admin-only hidden" data-action="import" title="JSON 백업 파일을 클라우드로 복원">↧ 복원</button><button id="auth-button" class="mini-btn" data-action="login">관리자 로그인</button></div>
</div></header>
<input id="import-file" type="file" accept="application/json,.json" aria-label="백업 파일 불러오기" />
<main class="shell" id="app" aria-live="polite"></main>
<footer class="shell footer"><span>IDOL INDEX © 2026 · Online K-POP Archive</span><span>기록과 사진은 Supabase 클라우드에 저장됩니다.</span></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="image-lightbox" class="image-lightbox" aria-label="원본 이미지 보기">
 <div class="lightbox-toolbar">
  <span>IMAGE VIEWER</span>
  <div class="lightbox-actions">
   <a id="image-original-link" href="#" target="_blank" rel="noopener noreferrer">원본 파일 열기 ↗</a>
   <button type="button" id="image-lightbox-close" aria-label="이미지 닫기">✕</button>
  </div>
 </div>
 <img id="lightbox-photo" alt="확대한 사진">
 <p class="lightbox-note">이미지를 화면 크기에 맞춰 표시합니다. 원본 해상도는 '원본 파일 열기'에서 확인할 수 있습니다.</p>
</dialog>
<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(()=>{'use strict';
const BUCKET='idol-media', TABLE='idol_records';
const config=window.IDOL_ARCHIVE_CONFIG||{};
let client=null;
const meta={girl:{title:'NEW GIRL GROUP',korean:'신인 걸그룹',accent:'GIRL GROUP',tag:'GIRL'},boy:{title:'NEW BOY GROUP',korean:'신인 보이그룹',accent:'BOY GROUP',tag:'BOY'},album:{title:'NEW ALBUM',korean:'신규 앨범',accent:'ALBUM',tag:'ALBUM'}};
const types=['미니','싱글','디지털싱글','정규'];
const state={view:'home',category:'girl',recordId:null,draft:null,all:[],search:'',urls:[],saving:false,importing:false,isAdmin:false,user:null,pasteTarget:null};
const app=document.getElementById('app');
function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function prettyDate(s){if(!s)return '날짜 미입력'; const d=new Date(s);return Number.isNaN(d.getTime())?esc(s):d.toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'});}
function newId(){return globalThis.crypto?.randomUUID?.()||('rec-'+Date.now()+'-'+Math.random().toString(36).slice(2));}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timeout);toast.timeout=setTimeout(()=>el.classList.remove('show'),3400);}
function cleanURLs(){state.urls.forEach(u=>URL.revokeObjectURL(u));state.urls=[];}
function imgURL(data){
 if(data instanceof Blob){const u=URL.createObjectURL(data);state.urls.push(u);return u;}
 if(typeof data==='string'&&/^https:\/\//.test(data))return data;
 return '';
}
function iconCover(blob,text='IMG',focusable=true){const src=imgURL(blob);return src?`<img class="${focusable?'zoomable-image':'catalog-image'}" src="${esc(src)}" alt="앨범/그룹 이미지" ${focusable?'role="button" tabindex="0" aria-label="사진 크게 보기" title="클릭하여 원본 이미지 보기"':'title="상세 페이지 보기"'}>`:`<div class="record-fallback">${esc(text)}</div>`;}
function defaultTrack(i){return {name:'',genre:'',youtube:'',title:i===0};}
function newDraft(type){return {id:newId(),type,groupName:'',company:'',debutDate:'',memberCount:2,members:[blankMember(),blankMember()],debutAlbumName:'',albumName:'',releaseDate:'',albumType:'미니',tracks:[defaultTrack(0)],groupPhoto:null,albumCover:null,officialX:'',melonHot100:'',melonTop100:'',firstWeekSales:'',mvViews:'',mvVideoId:'',mvCheckedAt:'',issueNotes:'',personalNotes:'',createdAt:new Date().toISOString(),updatedAt:''};}
function blankMember(){return {name:'',birthYear:'',nationality:'',position:'',photo:null,photoPath:null};}
async function getAll(){
 let records=[];
 for(let offset=0;offset<100000;offset+=500){
  const {data,error}=await client.from(TABLE).select('payload').order('updated_at',{ascending:false}).range(offset,offset+499);
  if(error)throw error;
  const page=(data||[]).map(x=>x.payload).filter(Boolean);
  records.push(...page);
  if(page.length<500)break;
 }
 return records;
}
async function put(record){
 if(!state.isAdmin)throw Error('관리자만 기록을 저장할 수 있습니다.');
 const old=state.all.find(item=>item.id===record.id);
 const r={...record,members:(record.members||[]).map(m=>({...m}))};
 const added=[];
 async function uploadPhoto(file,slot){
  const mime=file.type||'image/jpeg';
  const extensions={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'};
  if(!extensions[mime])throw Error('사진은 JPG, PNG, WEBP, GIF만 사용할 수 있습니다.');
  if(file.size>5*1024*1024)throw Error('사진 한 장은 최대 5MB까지 등록할 수 있습니다.');
  const path=`${r.id}/${slot}-${newId()}.${extensions[mime]}`;
  const {error}=await client.storage.from(BUCKET).upload(path,file,{cacheControl:'3600',upsert:false,contentType:mime});
  if(error)throw error;
  added.push(path);
  const {data}=client.storage.from(BUCKET).getPublicUrl(path);
  return {url:data.publicUrl,path};
 }
 try{
  for(const field of ['groupPhoto','albumCover']){
   if(r[field] instanceof Blob){
    const uploaded=await uploadPhoto(r[field],field);
    r[field]=uploaded.url;
    r[field+'Path']=uploaded.path;
   }
  }
  for(let i=0;i<r.members.length;i++){
   const member=r.members[i];
   if(member.photo instanceof Blob){
    const uploaded=await uploadPhoto(member.photo,`member-${i+1}`);
    member.photo=uploaded.url;
    member.photoPath=uploaded.path;
   }
  }
  const payload=JSON.parse(JSON.stringify(r));
  const {error}=await client.from(TABLE).upsert({id:r.id,type:r.type,payload,updated_at:r.updatedAt||new Date().toISOString()},{onConflict:'id'});
  if(error)throw error;
  if(old){
   const keep=new Set([r.groupPhotoPath,r.albumCoverPath,...r.members.map(m=>m.photoPath)].filter(Boolean));
   const previous=[old.groupPhotoPath,old.albumCoverPath,...(old.members||[]).map(m=>m.photoPath)];
   await cleanupImages(previous.filter(p=>p&&!keep.has(p)));
  }
  return payload;
 }catch(error){if(added.length)await cleanupImages(added);throw error;}
}
async function cleanupImages(paths){
 if(!paths.length)return;
 const {error}=await client.storage.from(BUCKET).remove([...new Set(paths)]);
 if(error)console.warn('이미지 정리 실패. Storage 대시보드에서 확인하세요.',error);
}
async function remove(id){
 if(!state.isAdmin)throw Error('관리자 전용 기능입니다.');
 const r=state.all.find(x=>x.id===id);
 const {error}=await client.from(TABLE).delete().eq('id',id);
 if(error)throw error;
 await cleanupImages([r?.groupPhotoPath,r?.albumCoverPath,...(r?.members||[]).map(m=>m.photoPath)].filter(Boolean));
}
async function reload(){state.all=(await getAll()).sort((a,b)=>String(b.updatedAt||b.createdAt).localeCompare(String(a.updatedAt||a.createdAt)));}
async function refreshAuth(){
 const {data,error}=await client.auth.getUser();
 state.user=error?null:data.user;
 state.isAdmin=false;
 if(state.user){
  const {data:isAdmin,error:rpcError}=await client.rpc('is_archive_admin');
  if(rpcError)console.error('관리자 확인 실패:',rpcError);
  state.isAdmin=!rpcError&&isAdmin===true;
 }
 updateHeader();
}
function updateHeader(){
 document.querySelectorAll('.admin-only').forEach(x=>x.classList.toggle('hidden',!state.isAdmin));
 const b=document.getElementById('auth-button');
 if(b){b.dataset.action=state.user?'logout':'login';b.textContent=state.user?(state.isAdmin?'관리자 로그아웃':'로그아웃'):'관리자 로그인';}
}
function goLogin(){state.view='login';show();}
function renderLogin(){
 app.innerHTML=`<button class="back-btn" data-action="home">← HOME</button><div class="login-shell"><div class="login-card"><div class="eyebrow">ADMIN / PRIVATE EDITOR</div><h2>관리자 로그인</h2><p>방문자는 기록을 열람할 수 있으며 등록·수정·삭제는 관리자 계정으로만 가능합니다.</p><form id="login-form"><label for="admin-email">이메일</label><input id="admin-email" type="email" name="email" autocomplete="username" required placeholder="admin@example.com"><label for="admin-password">비밀번호</label><input id="admin-password" type="password" name="password" autocomplete="current-password" required><button class="primary-btn" id="login-submit" type="submit">로그인</button><p class="status-note">계정은 Supabase Dashboard의 Authentication → Users에서 생성합니다. 사이트에 회원가입 기능은 없습니다.</p></form></div></div>`;
}
async function loginSubmit(form){
 const btn=document.getElementById('login-submit');btn.disabled=true;
 try{
  const {error}=await client.auth.signInWithPassword({email:form.elements.email.value.trim(),password:form.elements.password.value});
  if(error)throw error;
  await refreshAuth();
  if(!state.isAdmin){await client.auth.signOut();await refreshAuth();throw Error('이 계정에는 관리자 권한이 없습니다. SQL에서 관리자 계정 등록 여부를 확인하세요.');}
  await reload();goHome();toast('관리자 로그인 완료');
 }catch(e){console.error(e);toast('로그인 실패: '+e.message);}finally{btn.disabled=false;}
}
async function logout(){const {error}=await client.auth.signOut();if(error){toast('로그아웃 실패: '+error.message);return;}await refreshAuth();goHome();toast('로그아웃했습니다.');}
function count(type){return state.all.filter(r=>r.type===type).length;}
function nav(active){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===active));}
function show(){cleanURLs();updateHeader();nav(state.view==='home'?'home':state.category);if(state.view==='home')renderHome();else if(state.view==='category')renderCategory();else if(state.view==='form')renderForm();else if(state.view==='detail')renderDetail();else if(state.view==='login')renderLogin();window.scrollTo({top:0,behavior:'instant'});}
function goHome(){state.view='home';state.search='';show();}
function goCategory(type){if(!meta[type])return;state.category=type;state.view='category';state.search='';show();}
function beginNew(type){if(!state.isAdmin)return goLogin();state.category=type;state.view='form';state.recordId=null;state.draft=newDraft(type);show();}
function beginEdit(id){if(!state.isAdmin)return goLogin();const old=state.all.find(r=>r.id===id);if(!old)return toast('자료를 찾지 못했습니다.');state.category=old.type;state.view='form';state.recordId=id;state.draft={...old,officialX:old.officialX||'',melonHot100:old.melonHot100||'',melonTop100:old.melonTop100||'',firstWeekSales:old.firstWeekSales||'',mvViews:old.mvViews||'',mvVideoId:old.mvVideoId||'',mvCheckedAt:old.mvCheckedAt||'',issueNotes:old.issueNotes||'',personalNotes:old.personalNotes||'',members:(old.members||[]).map(m=>({...m})),tracks:(old.tracks||[]).map(t=>({...t}))};if(!state.draft.tracks.length)state.draft.tracks=[defaultTrack(0)];if(old.type!=='album')syncMembers(state.draft.memberCount||2);show();}
function showDetail(id){const rec=state.all.find(r=>r.id===id);if(!rec)return;state.category=rec.type;state.view='detail';state.recordId=id;show();}

function renderHome(){app.innerHTML=`<section class="home-hero"><div class="eyebrow">YOUR PERSONAL K-POP DATABASE / VOL. 001</div><h1 class="main-title">Archive the<br><em>Next Era.</em></h1><p class="intro">새롭게 데뷔하는 아이돌 그룹부터 발매 앨범까지.<br>필요한 정보를 차곡차곡 기록하고, 언제든 다시 꺼내 보는 나만의 K-POP 아카이브.</p></section><div class="section-head"><div><h2>Explore Collections</h2><p>카테고리를 선택해 새로운 기록을 추가하세요.</p></div><span class="smallcaps">SELECT A CATEGORY ↘</span></div><div class="category-grid">${categoryTile('girl',1)}${categoryTile('boy',2)}${categoryTile('album',3)}</div><div class="stats-bar"><div class="stat"><span>GIRL GROUP</span><strong>${count('girl')}</strong></div><div class="stat"><span>BOY GROUP</span><strong>${count('boy')}</strong></div><div class="stat"><span>ALBUM</span><strong>${count('album')}</strong></div></div><div class="section-head"><div><h2>Recently Archived</h2><p>가장 최근에 추가하거나 수정한 자료</p></div></div><div class="list-grid">${state.all.length?state.all.slice(0,6).map(recordCard).join(''):`<div class="empty"><strong>아직 보관된 자료가 없습니다.</strong><span>위의 카테고리를 눌러 첫 번째 기록을 만들어 보세요.</span></div>`}</div><p class="notice">* 클라우드 동기화 아카이브입니다. 자료는 모든 기기에서 동일하게 보이며, 등록·수정·삭제는 관리자 로그인 후 가능합니다.</p>`;}

// Bold memo text is stored as plain Markdown (**text**), not user-supplied HTML.
function memoMarkup(value){
 return esc(String(value||'')).replace(/\*\*([\s\S]+?)\*\*/g,'<strong>$1</strong>');
}
function memoNodeText(node){
 if(node.nodeType===3)return node.nodeValue||'';
 if(node.nodeType!==1)return '';
 const name=node.nodeName.toUpperCase();
 if(name==='BR')return '\n';
 let inner='';
 Array.from(node.childNodes).forEach((child,index)=>{
  const block=child.nodeType===1&&/^(DIV|P|LI)$/.test(child.nodeName);
  if(block&&index>0&&inner&&!inner.endsWith('\n'))inner+='\n';
  inner+=memoNodeText(child);
 });
 const bold=name==='B'||name==='STRONG'||(name==='SPAN'&&/^(bold|[6-9]00)$/i.test(node.style.fontWeight||''));
 if(bold&&inner)return '**'+inner+'**';
 return inner;
}
function memoPlainText(editor){
 return memoNodeText(editor).replace(/\r\n/g,'\n').replace(/\u00a0/g,' ');
}

// Official X account links are restricted to public X/Twitter profile URLs.
function officialXUrl(value){
 const raw=String(value||'').trim();
 if(!raw)return '';
 const matchAt=/^@([A-Za-z0-9_]{1,15})$/.exec(raw);
 if(matchAt)return 'https://x.com/'+matchAt[1];
 try{
  const u=new URL(/^https?:\/\//i.test(raw)?raw:'https://'+raw);
  if(!['http:','https:'].includes(u.protocol))return '';
  if(!['x.com','www.x.com','twitter.com','www.twitter.com','mobile.twitter.com'].includes(u.hostname.toLowerCase()))return '';
  const match=/^\/([A-Za-z0-9_]{1,15})\/?$/.exec(u.pathname);
  if(!match)return '';
  if(['home','explore','search','notifications','messages','settings','login','signup','intent','share','i','compose'].includes(match[1].toLowerCase()))return '';
  return 'https://x.com/'+match[1];
 }catch{return '';}
}
function officialXBadge(value){

}
function youtubeId(link){
 try{
  const u=new URL(String(link||'').trim());
  if(u.protocol!=='https:'&&u.protocol!=='http:')return '';
  const host=u.hostname.toLowerCase();
  let id='';
  if(['youtu.be','www.youtu.be'].includes(host))id=u.pathname.split('/')[1]||'';
  else if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(host)){
   if(u.pathname==='/watch')id=u.searchParams.get('v')||'';
   else if(/^\/(shorts|embed|live)\//.test(u.pathname))id=u.pathname.split('/')[2]||'';
  }
  return /^[a-zA-Z0-9_-]{11}$/.test(id)?id:'';
 }catch{return '';}
}
function titleVideoId(record){
 const tracks=record?.tracks||[];
 const t=tracks.find(x=>x.title&&youtubeId(x.youtube))||tracks.find(x=>youtubeId(x.youtube));
 return t?youtubeId(t.youtube):'';
}
function formatMetric(n,suffix=''){
 const str=String(n??'').trim().replace(/,/g,'');
 if(!/^\d+$/.test(str))return '';
 return Number(str).toLocaleString('ko-KR')+suffix;
}

function blobToDataURL(blob){return new Promise((resolve,reject)=>{if(!blob)return resolve(null);const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob);});}
function dataURLToBlob(url){if(!url||typeof url!=='string')return null;const m=/^data:([^;,]+)?(;base64)?,(.*)$/s.exec(url);if(!m)throw Error('이미지 데이터 형식이 잘못되었습니다.');if(!m[2])return new Blob([decodeURIComponent(m[3])],{type:m[1]||'application/octet-stream'});const b=atob(m[3]);const bytes=new Uint8Array(b.length);for(let i=0;i<b.length;i++)bytes[i]=b.charCodeAt(i);return new Blob([bytes],{type:m[1]||'application/octet-stream'});}
async function imageToDataURL(v){
 if(!v)return null;
 if(v instanceof Blob)return blobToDataURL(v);
 if(typeof v==='string'&&v.startsWith('data:'))return v;
 if(typeof v==='string'&&v.startsWith('https://')){
  const res=await fetch(v);
  if(!res.ok)throw Error('이미지를 백업하지 못했습니다: HTTP '+res.status);
  return blobToDataURL(await res.blob());
 }
 return null;
}

async function importBackup(file){

  const obj=JSON.parse(await file.text());
  if(obj.format!=='idol-index-backup'||obj.version!==1||!Array.isArray(obj.records))throw Error('원본 사이트의 JSON 백업 파일만 지원합니다.');
  if(!obj.records.length){toast('백업 파일에 기록이 없습니다.');return;}
  if(!confirm(`${obj.records.length}개 기록을 클라우드에 복원할까요?\n같은 ID는 새 내용으로 덮어씁니다. 사진도 업로드됩니다.`))return;
  state.importing=true;let n=0;
  for(const r of obj.records){
   if(!meta[r.type]||typeof r.id!=='string'||!r.id||!Array.isArray(r.tracks))continue;
   const copy={...r};
   for(const k of ['groupPhoto','albumCover']){
    copy[k]=copy[k]&&copy[k].startsWith('data:')?dataURLToBlob(copy[k]):null;
    copy[k+'Path']=null;
   }
   copy.members=(copy.members||[]).map(m=>({...m,photo:typeof m.photo==='string'&&m.photo.startsWith('data:')?dataURLToBlob(m.photo):null,photoPath:null}));
   copy.updatedAt=new Date().toISOString();
   await put(copy);n++;
  }
  await reload();goHome();toast(`${n}개 기록을 클라우드에 복원했습니다.`);
 }catch(err){console.error(err);await reload().catch(()=>{});toast(`복원 중단: ${err.message||'백업 파일을 확인하세요.'}. 이미 업로드된 기록은 유지됩니다.`);}finally{state.importing=false;document.getElementById('import-file').value='';}
}
// Image clipboard support; only explicit image targets are modified.
function getPasteTarget(element){
 const node=element?.closest?.('[data-paste-kind]');
 if(!node)return null;
 if(node.dataset.pasteKind==='field'&&['groupPhoto','albumCover'].includes(node.dataset.pasteKey))return {kind:'field',key:node.dataset.pasteKey};
 if(node.dataset.pasteKind==='member'&&/^\d+$/.test(node.dataset.pasteIndex||''))return {kind:'member',index:Number(node.dataset.pasteIndex)};
 return null;
}
function activatePasteTarget(target){
 state.pasteTarget=target;
 document.querySelectorAll('.paste-selected').forEach(el=>el.classList.remove('paste-selected'));
 if(!target)return;
 const selector=target.kind==='field'?'[data-paste-kind="field"][data-paste-key="'+target.key+'"].upload':'[data-paste-kind="member"][data-paste-index="'+target.index+'"].member-photo';

function acceptImageFile(file,target){
 if(!state.isAdmin||state.view!=='form'||!state.draft||!target||!file)return false;
 if(!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type)||file.size>5*1024*1024||file.size===0){
  toast('JPG·PNG·WEBP·GIF 형식의 5MB 이하 이미지만 사용할 수 있습니다.');return false;
 }
 let container;
 if(target.kind==='field'){
  if(!['groupPhoto','albumCover'].includes(target.key))return false;
  state.draft[target.key]=file;
  container=document.querySelector('.upload[data-paste-key="'+target.key+'"]');
 }else if(target.kind==='member'){
  const member=state.draft.members?.[target.index];
  if(!member)return false;
  member.photo=file;
  container=document.querySelector('.member-photo[data-paste-index="'+target.index+'"]');
 }else return false;
 if(container){
  const url=URL.createObjectURL(file);state.urls.push(url);
  container.querySelector('img,.upload-label,.member-photo-placeholder')?.remove();
  const img=document.createElement('img');img.src=url;img.alt='선택한 이미지 미리보기';
  container.prepend(img);
 }
 activatePasteTarget(target);
 return true;
}
async function pasteImageFromClipboard(button){
 const target=getPasteTarget(button);
 if(!target)return;
 activatePasteTarget(target);
 if(!navigator.clipboard?.read){toast('이 브라우저에서는 버튼 붙여넣기를 지원하지 않습니다. 이미지를 복사하고 Ctrl+V를 누르세요.');return;}
 try{
  const entries=await navigator.clipboard.read();
  for(const entry of entries){
   const mime=entry.types.find(t=>['image/png','image/jpeg','image/webp','image/gif'].includes(t));
   if(!mime)continue;
   const blob=await entry.getType(mime);
   if(acceptImageFile(blob,target))toast('이미지를 붙여넣었습니다. 기록 저장하기를 눌러 서버에 저장하세요.');
   return;
  }
  toast('클립보드에 이미지가 없습니다. 사진에서 ‘이미지 복사’를 선택해 주세요.');
 }catch(error){
  console.warn('클립보드 직접 읽기 실패:',error);
  toast('클립보드 접근이 제한됐습니다. 이 버튼을 선택한 상태에서 Ctrl+V (Mac: ⌘V)를 누르세요.');
 }
}

 if(state.view!=='detail'||!img?.closest?.('.detail-shell')||!img.src)return;
 const dialog=document.getElementById('image-lightbox');
 const photo=document.getElementById('lightbox-photo');
 const original=document.getElementById('image-original-link');
 if(!dialog||!photo||!original)return;
 const url=img.currentSrc||img.src;
 photo.src=url;photo.alt=img.alt||'원본 이미지';
 original.href=url;
 if(!dialog.open)dialog.showModal();
}
document.getElementById('image-lightbox-close').addEventListener('click',()=>document.getElementById('image-lightbox').close());
document.getElementById('image-lightbox').addEventListener('click',event=>{
 if(event.target===event.currentTarget)event.currentTarget.close();
});
document.addEventListener('click',event=>{
 const img=event.target.closest?.('img.zoomable-image');
 if(!img||state.view!=='detail'||!img.closest('.detail-shell'))return;
 event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();
 openImageLightbox(img);
},true);
document.addEventListener('keydown',event=>{
 const img=event.target.closest?.('img.zoomable-image[tabindex="0"]');
 if(!img||state.view!=='detail'||!img.closest('.detail-shell')||!['Enter',' '].includes(event.key))return;
 event.preventDefault();event.stopPropagation();
 openImageLightbox(img);
},true);
document.addEventListener('click',async e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action;if(state.view==='form'&&['add-track','remove-track','mark-title'].includes(action))syncEditorFields();switch(action){case'home':goHome();break;case'category':goCategory(btn.dataset.type);break;case'new':beginNew(btn.dataset.type);break;case'detail':showDetail(btn.dataset.id);break;case'edit':beginEdit(btn.dataset.id);break;case'delete':await deleteRecord(btn.dataset.id);break;case'add-track':if(state.draft.tracks.length>=100){toast('트랙은 최대 100곡까지 추가할 수 있습니다.');break;}state.draft.tracks.push(defaultTrack(1));renderTracks();break;case'remove-track':if(state.draft.tracks.length>1){const removed=state.draft.tracks.pop();if(removed.title)state.draft.tracks[0].title=true;renderTracks();}else toast('트랙은 최소 1곡이 필요합니다.');break;case'mark-title':{const i=Number(btn.dataset.index);state.draft.tracks.forEach((t,j)=>t.title=i===j);renderTracks();break;}case'memo-bold':toggleMemoBold(btn);break;case'paste-image':await pasteImageFromClipboard(btn);break;case'refresh-views':await refreshMVViews();break;case'export':await exportBackup();break;case'import':if(state.isAdmin)document.getElementById('import-file').click();else goLogin();break;case'login':goLogin();break;case'logout':await logout();break;}});
document.addEventListener('input',e=>{
 const target=e.target;
 if(target.id==='search-records'){state.search=target.value;renderRecordList();return;}
 syncEditorInput(target);
});
// Korean IME may finalize the last syllable only at compositionend or on focus loss.
document.addEventListener('compositionend',e=>syncEditorInput(e.target));
document.addEventListener('focusout',e=>syncEditorInput(e.target));
// Prevent the IME confirmation Enter key from inadvertently submitting the entire editor.
document.addEventListener('keydown',e=>{
 if(e.key!=='Enter'||!e.target.closest?.('#editor'))return;
 if(e.isComposing||e.keyCode===229||e.target.matches('input[type="text"],input[type="date"],input[type="url"],input[type="number"],input[type="search"]'))e.preventDefault();
});
document.addEventListener('change',event=>{
 const t=event.target;
 if(t.id==='import-file'){importBackup(t.files?.[0]);return;}
 if(!state.draft)return;
 if(t.dataset.action==='member-count'){syncEditorFields();
  if(t.value==='more')syncMembers(Math.max(13,state.draft.memberCount));else syncMembers(Number(t.value));
  renderForm();return;
 }
 if(t.dataset.action==='member-extra'){syncEditorFields();syncMembers(Number(t.value)>=13?Number(t.value):13);renderForm();return;}
 const image=t.files?.[0];
 if(!image)return;
 if(t.dataset.memberImageIndex!==undefined){
  acceptImageFile(image,{kind:'member',index:Number(t.dataset.memberImageIndex)});
 }else if(t.dataset.image){
  acceptImageFile(image,{kind:'field',key:t.dataset.image});
 }
});
document.addEventListener('submit',e=>{if(e.target.id==='editor'){e.preventDefault();saveForm();}else if(e.target.id==='login-form'){e.preventDefault();loginSubmit(e.target);}});
(async()=>{
 try{
  if(!/^https:\/\/[^\s]+\.supabase\.co\/?$/.test(config.supabaseUrl||'')||!/^sb_publishable_/.test(config.supabaseKey||'')){
   throw Error('config.js에 Supabase Project URL과 Publishable key를 입력해 주세요.');
  }
  if(!window.supabase?.createClient)throw Error('Supabase 라이브러리를 불러오지 못했습니다. 인터넷 연결 또는 CDN 접근을 확인하세요.');
  client=window.supabase.createClient(config.supabaseUrl,config.supabaseKey);
  await refreshAuth();await reload();goHome();
 }catch(err){
  console.error(err);
  app.innerHTML=`<section class="section-card"><div class="eyebrow">SETUP REQUIRED</div><h1>클라우드 연결 설정이 필요합니다.</h1><p>${esc(err.message||'알 수 없는 오류')}</p><p>① Supabase SQL 실행 ② 관리자 계정 등록 ③ config.js에 Project URL · Publishable key 입력 ④ GitHub Pages에 전체 파일 업로드</p><p class="note">설정과 SQL 작성법은 함께 제공한 README.md 파일을 참고하세요.</p></section>`;
 }
})();

})();
</script>
</body>
