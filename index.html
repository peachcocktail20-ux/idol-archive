function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function prettyDate(s){if(!s)return '날짜 미입력'; const d=new Date(s);return Number.isNaN(d.getTime())?esc(s):d.toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'});}
function newId(){return globalThis.crypto?.randomUUID?.()||('rec-'+Date.now()+'-'+Math.random().toString(36).slice(2));}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timeout);toast.timeout=setTimeout(()=>el.classList.remove('show'),3400);}
function cleanURLs(){state.urls.forEach(u=>URL.revokeObjectURL(u));state.urls=[];}
function imgURL(data){
 if(data instanceof Blob){const u=URL.createObjectURL(data);state.urls.push(u);return u;}
 if(typeof data==='string'&&/^https:\/\//.test(data))return data;
 return '';
}
function iconCover(blob,text='IMG'){const src=imgURL(blob);return src?`<img src="${esc(src)}" alt="앨범/그룹 이미지">`:`<div class="record-fallback">${esc(text)}</div>`;}
function defaultTrack(i){return {name:'',genre:'',youtube:'',title:i===0};}
function newDraft(type){return {id:newId(),type,groupName:'',company:'',debutDate:'',memberCount:2,members:[blankMember(),blankMember()],debutAlbumName:'',albumName:'',releaseDate:'',albumType:'미니',tracks:[defaultTrack(0)],groupPhoto:null,albumCover:null,createdAt:new Date().toISOString(),updatedAt:''};}
function blankMember(){return {name:'',birthYear:'',nationality:'',position:'',photo:null,photoPath:null};}
async function getAll(){
 let records=[];
 for(let offset=0;offset<100000;offset+=500){
  const {data,error}=await client.from(TABLE).select('payload').order('updated_at',{ascending:false}).range(offset,offset+499);
  if(error)throw error;
  const page=(data||[]).map(x=>x.payload).filter(Boolean);
  records.push(...page);
  if(page.length<500)break;
 }
 return records;
}
async function put(record){
 if(!state.isAdmin)throw Error('관리자만 기록을 저장할 수 있습니다.');
 const old=state.all.find(item=>item.id===record.id);
 const r={...record,members:(record.members||[]).map(m=>({...m}))};
 const added=[];
 async function uploadPhoto(file,slot){
  const mime=file.type||'image/jpeg';
  const extensions={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'};
  if(!extensions[mime])throw Error('사진은 JPG, PNG, WEBP, GIF만 사용할 수 있습니다.');
  if(file.size>5*1024*1024)throw Error('사진 한 장은 최대 5MB까지 등록할 수 있습니다.');
  const path=`${r.id}/${slot}-${newId()}.${extensions[mime]}`;
  const {error}=await client.storage.from(BUCKET).upload(path,file,{cacheControl:'3600',upsert:false,contentType:mime});
  if(error)throw error;
  added.push(path);
  const {data}=client.storage.from(BUCKET).getPublicUrl(path);
  return {url:data.publicUrl,path};
 }
 try{
  for(const field of ['groupPhoto','albumCover']){
   if(r[field] instanceof Blob){
    const uploaded=await uploadPhoto(r[field],field);
    r[field]=uploaded.url;
    r[field+'Path']=uploaded.path;
   }
  }
  for(let i=0;i<r.members.length;i++){
   const member=r.members[i];
   if(member.photo instanceof Blob){
    const uploaded=await uploadPhoto(member.photo,`member-${i+1}`);
    member.photo=uploaded.url;
    member.photoPath=uploaded.path;
   }
  }
  const payload=JSON.parse(JSON.stringify(r));
  const {error}=await client.from(TABLE).upsert({id:r.id,type:r.type,payload,updated_at:r.updatedAt||new Date().toISOString()},{onConflict:'id'});
  if(error)throw error;
  if(old){
   const keep=new Set([r.groupPhotoPath,r.albumCoverPath,...r.members.map(m=>m.photoPath)].filter(Boolean));
   const previous=[old.groupPhotoPath,old.albumCoverPath,...(old.members||[]).map(m=>m.photoPath)];
   await cleanupImages(previous.filter(p=>p&&!keep.has(p)));
  }
  return payload;
 }catch(error){if(added.length)await cleanupImages(added);throw error;}
}
async function cleanupImages(paths){
 if(!paths.length)return;
 const {error}=await client.storage.from(BUCKET).remove([...new Set(paths)]);
 if(error)console.warn('이미지 정리 실패. Storage 대시보드에서 확인하세요.',error);
}
async function remove(id){
 if(!state.isAdmin)throw Error('관리자 전용 기능입니다.');
 const r=state.all.find(x=>x.id===id);
 const {error}=await client.from(TABLE).delete().eq('id',id);
 if(error)throw error;
 await cleanupImages([r?.groupPhotoPath,r?.albumCoverPath,...(r?.members||[]).map(m=>m.photoPath)].filter(Boolean));
}
async function reload(){state.all=(await getAll()).sort((a,b)=>String(b.updatedAt||b.createdAt).localeCompare(String(a.updatedAt||a.createdAt)));}
async function refreshAuth(){
 const {data,error}=await client.auth.getUser();
 state.user=error?null:data.user;
 state.isAdmin=false;
 if(state.user){
  const {data:isAdmin,error:rpcError}=await client.rpc('is_archive_admin');
  if(rpcError)console.error('관리자 확인 실패:',rpcError);
  state.isAdmin=!rpcError&&isAdmin===true;
 }
 updateHeader();
}
function updateHeader(){
 document.querySelectorAll('.admin-only').forEach(x=>x.classList.toggle('hidden',!state.isAdmin));
 const b=document.getElementById('auth-button');
 if(b){b.dataset.action=state.user?'logout':'login';b.textContent=state.user?(state.isAdmin?'관리자 로그아웃':'로그아웃'):'관리자 로그인';}
}
function goLogin(){state.view='login';show();}
function renderLogin(){
 app.innerHTML=`<button class="back-btn" data-action="home">← HOME</button><div class="login-shell"><div class="login-card"><div class="eyebrow">ADMIN / PRIVATE EDITOR</div><h2>관리자 로그인</h2><p>방문자는 기록을 열람할 수 있으며 등록·수정·삭제는 관리자 계정으로만 가능합니다.</p><form id="login-form"><label for="admin-email">이메일</label><input id="admin-email" type="email" name="email" autocomplete="username" required placeholder="admin@example.com"><label for="admin-password">비밀번호</label><input id="admin-password" type="password" name="password" autocomplete="current-password" required><button class="primary-btn" id="login-submit" type="submit">로그인</button><p class="status-note">계정은 Supabase Dashboard의 Authentication → Users에서 생성합니다. 사이트에 회원가입 기능은 없습니다.</p></form></div></div>`;
}
async function loginSubmit(form){
 const btn=document.getElementById('login-submit');btn.disabled=true;
 try{
  const {error}=await client.auth.signInWithPassword({email:form.elements.email.value.trim(),password:form.elements.password.value});
  if(error)throw error;
  await refreshAuth();
  if(!state.isAdmin){await client.auth.signOut();await refreshAuth();throw Error('이 계정에는 관리자 권한이 없습니다. SQL에서 관리자 계정 등록 여부를 확인하세요.');}
  await reload();goHome();toast('관리자 로그인 완료');
 }catch(e){console.error(e);toast('로그인 실패: '+e.message);}finally{btn.disabled=false;}
}
async function logout(){const {error}=await client.auth.signOut();if(error){toast('로그아웃 실패: '+error.message);return;}await refreshAuth();goHome();toast('로그아웃했습니다.');}
function count(type){return state.all.filter(r=>r.type===type).length;}
function nav(active){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===active));}
function show(){cleanURLs();updateHeader();nav(state.view==='home'?'home':state.category);if(state.view==='home')renderHome();else if(state.view==='category')renderCategory();else if(state.view==='form')renderForm();else if(state.view==='detail')renderDetail();else if(state.view==='login')renderLogin();window.scrollTo({top:0,behavior:'instant'});}
function goHome(){state.view='home';state.search='';show();}
function goCategory(type){if(!meta[type])return;state.category=type;state.view='category';state.search='';show();}
function beginNew(type){if(!state.isAdmin)return goLogin();state.category=type;state.view='form';state.recordId=null;state.draft=newDraft(type);show();}
function beginEdit(id){if(!state.isAdmin)return goLogin();const old=state.all.find(r=>r.id===id);if(!old)return toast('자료를 찾지 못했습니다.');state.category=old.type;state.view='form';state.recordId=id;state.draft={...old,members:(old.members||[]).map(m=>({...m})),tracks:(old.tracks||[]).map(t=>({...t}))};if(!state.draft.tracks.length)state.draft.tracks=[defaultTrack(0)];if(old.type!=='album')syncMembers(state.draft.memberCount||2);show();}
function showDetail(id){const rec=state.all.find(r=>r.id===id);if(!rec)return;state.category=rec.type;state.view='detail';state.recordId=id;show();}
function categoryTile(type,num){const m=meta[type];return `<button class="category ${type}" data-action="category" data-type="${type}"><span class="cat-kicker">COLLECTION / 0${num}</span><span class="cat-title">${m.title.replace('NEW ','NEW<br>')}</span><span class="cat-meta"><span class="cat-arrow">↗</span>${count(type)}개의 기록</span><span class="graphic" aria-hidden="true"></span></button>`;}
function renderHome(){app.innerHTML=`<div class="eyebrow">YOUR PERSONAL K-POP DATABASE / VOL. 001</div><h1 class="main-title">Archive the<br><em>Next Era.</em></h1><p class="intro">새롭게 데뷔하는 아이돌 그룹부터 발매 앨범까지.<br>필요한 정보를 차곡차곡 기록하고, 언제든 다시 꺼내 보는 나만의 K-POP 아카이브.</p><div class="section-head"><div><h2>Explore Collections</h2><p>카테고리를 선택해 새로운 기록을 추가하세요.</p></div><span class="smallcaps">SELECT A CATEGORY ↘</span></div><div class="category-grid">${categoryTile('girl',1)}${categoryTile('boy',2)}${categoryTile('album',3)}</div><div class="stats-bar"><div class="stat"><span>GIRL GROUP</span><strong>${count('girl')}</strong></div><div class="stat"><span>BOY GROUP</span><strong>${count('boy')}</strong></div><div class="stat"><span>ALBUM</span><strong>${count('album')}</strong></div></div><div class="section-head"><div><h2>Recently Archived</h2><p>가장 최근에 추가하거나 수정한 자료</p></div></div><div class="list-grid">${state.all.length?state.all.slice(0,6).map(recordCard).join(''):`<div class="empty"><strong>아직 보관된 자료가 없습니다.</strong><span>위의 카테고리를 눌러 첫 번째 기록을 만들어 보세요.</span></div>`}</div><p class="notice">* 클라우드 동기화 아카이브입니다. 자료는 모든 기기에서 동일하게 보이며, 등록·수정·삭제는 관리자 로그인 후 가능합니다.</p>`;}
function cardTitle(r){return r.type==='album'?r.albumName:r.groupName;}
function recordCard(r){const photo=r.type==='album'?r.albumCover:(r.groupPhoto||r.albumCover);const secondary=r.type==='album'?r.groupName:(r.company||r.debutAlbumName);return `<article class="record-card"><button class="record-open" data-action="detail" data-id="${esc(r.id)}"><div class="record-cover">${iconCover(photo,'IDOL')}<span class="record-tag">${meta[r.type].tag}</span></div><div class="record-info"><h3>${esc(cardTitle(r)||'이름 없는 기록')}</h3><p>${esc(secondary||'추가 정보 없음')} · ${esc(r.albumType||'앨범 미선택')}</p></div></button><div class="record-bottom"><span class="record-date">${prettyDate(r.debutDate||r.releaseDate||r.createdAt)}</span>${state.isAdmin?`<div><button class="text-button" data-action="edit" data-id="${esc(r.id)}">수정</button><button class="text-button danger" data-action="delete" data-id="${esc(r.id)}">삭제</button></div>`:""}</div></article>`;}
function filteredRecords(){const q=state.search.trim().toLocaleLowerCase();return state.all.filter(r=>r.type===state.category).filter(r=>!q||[r.groupName,r.company,r.albumName,r.debutAlbumName,(r.tracks||[]).map(t=>t.name).join(' ')].some(x=>String(x||'').toLocaleLowerCase().includes(q)));}
function renderRecordList(){const area=document.getElementById('record-list');if(!area)return;const records=filteredRecords();area.innerHTML=records.length?records.map(recordCard).join(''):`<div class="empty"><strong>${state.search?'검색 결과가 없습니다.':'아직 기록이 없습니다.'}</strong><span>${state.search?'다른 키워드로 검색해 보세요.':'새 기록 추가 버튼을 눌러 자료를 저장할 수 있습니다.'}</span></div>`;}
function renderCategory(){const m=meta[state.category],type=state.category;app.innerHTML=`<button class="back-btn" data-action="home">← HOME</button><div class="page-top"><div><div class="eyebrow">THE ARCHIVE / ${m.accent}</div><h1 class="page-heading ${type}">NEW <span class="accent">${type==='album'?'ALBUM':type==='girl'?'GIRL GROUP':'BOY GROUP'}</span></h1><p class="page-description">${m.korean} 정보를 등록하고 관리하는 공간 · 총 ${count(type)}개 기록</p></div>${state.isAdmin?`<button class="primary-btn" data-action="new" data-type="${type}"><span style="font-size:20px;line-height:0">+</span> 새 기록 추가</button>`:""}</div><div class="searchbar"><span>⌕</span><input id="search-records" aria-label="기록 검색" type="search" value="${esc(state.search)}" placeholder="그룹명, 앨범명, 회사명, 수록곡으로 검색"></div><div id="record-list" class="list-grid"></div>`;renderRecordList();}
function textField(label,key,placeholder='',options={}){return `<div class="field ${options.full?'full':''}"><label for="field-${key}">${label}${options.optional?'<span class="optional">(선택)</span>':' <span class="required">*</span>'}</label><input id="field-${key}" data-field="${key}" type="${options.date?'date':'text'}" placeholder="${esc(placeholder)}" value="${esc(state.draft[key]||'')}" ${options.required?'required':''}></div>`;}
function memberSelector(){const n=state.draft.memberCount||2;return `<div class="field"><label for="member-count">멤버 수 <span class="required">*</span></label><select id="member-count" data-action="member-count">${Array.from({length:11},(_,i)=>i+2).map(x=>`<option value="${x}" ${n===x?'selected':''}>${x}명</option>`).join('')}<option value="more" ${n>=13?'selected':''}>12+명 (직접 입력)</option></select></div>${n>=13?`<div class="field"><label for="member-extra">정확한 인원</label><input id="member-extra" data-action="member-extra" type="number" min="13" max="99" value="${n}"></div>`:''}`;}
function selectAlbumType(){return `<div class="field"><label for="album-type">앨범 종류 <span class="required">*</span></label><select id="album-type" data-field="albumType">${types.map(t=>`<option ${state.draft.albumType===t?'selected':''}>${t}</option>`).join('')}</select></div>`;}
function imageField(label,key){const u=imgURL(state.draft[key]);return `<div class="field"><label>${label}<span class="optional">(JPG, PNG, WEBP 등)</span></label><div class="upload" data-preview="${key}">${u?`<img src="${esc(u)}" alt="${esc(label)} 미리보기">`:`<div class="upload-label"><span class="upload-icon">↥</span><strong>이미지 업로드</strong><span>클릭하여 파일 선택</span></div>`}<input type="file" data-image="${key}" accept="image/*" aria-label="${esc(label)} 이미지 업로드"></div><p class="note">사진을 변경하지 않으면 기존 이미지가 유지됩니다.</p></div>`;}
function renderForm(){const d=state.draft,isAlbum=d.type==='album',editing=!!state.recordId;
const base=isAlbum?`<div class="entry-row album-entry"><div class="entry-photo">${imageField('앨범 커버','albumCover')}</div><div class="entry-details"><div class="field-grid">${textField('앨범명','albumName','예: First Light',{required:true})}${textField('그룹 이름','groupName','예: ARTIST NAME')}${textField('발매일','releaseDate','',{date:true,optional:true})}${selectAlbumType()}</div></div></div>`:`<div class="entry-row group-entry"><div class="entry-photo">${imageField('그룹 사진','groupPhoto')}</div><div class="entry-details"><div class="field-grid">${textField('그룹명','groupName','예: ARTIST NAME',{required:true})}${textField('회사명','company','예: OO Entertainment',{optional:true})}${textField('데뷔일','debutDate','',{date:true,optional:true})}${memberSelector()}</div></div></div><div class="entry-row album-entry"><div class="entry-photo">${imageField('앨범 커버','albumCover')}</div><div class="entry-details"><div class="field-grid single-fields">${textField('데뷔 앨범명','debutAlbumName','예: First Mini Album',{optional:true,full:true})}${selectAlbumType()}</div></div></div>`;
app.innerHTML=`<button class="back-btn" data-action="category" data-type="${d.type}">← ${meta[d.type].title}</button><div class="page-top"><div><div class="eyebrow">${editing?'EDIT RECORD':'NEW ENTRY'} / ${meta[d.type].title}</div><h1 class="page-heading">${editing?'기록 수정':'새 기록 추가'}<span class="accent">.</span></h1><p class="page-description">입력한 내용은 저장 후에도 언제든 다시 수정할 수 있습니다.</p></div></div><form id="editor" novalidate><div class="form-layout"><div class="form-main"><section class="section-card"><div class="form-section-head"><h2><span class="section-num">01</span>${isAlbum?'앨범 기본 정보':'그룹 · 데뷔 정보'}</h2></div>${base}</section>${isAlbum?'':`<section class="section-card"><div class="form-section-head"><h2><span class="section-num">02</span>멤버 정보 <span style="color:#969c9b;font-weight:500;font-size:12px">(${d.memberCount}명)</span></h2></div><div id="members-container" class="member-grid"></div></section>`}<section class="section-card"><div class="form-section-head"><h2><span class="section-num">${isAlbum?'02':'03'}</span>트랙리스트</h2><div class="track-controls"><div class="stepper"><button type="button" data-action="remove-track" aria-label="수록곡 1개 삭제">−</button><span id="track-count">${d.tracks.length}</span><button type="button" data-action="add-track" aria-label="수록곡 1개 추가">+</button></div></div></div><p class="note" style="margin:-10px 0 18px">곡 수를 +/− 버튼으로 조절하세요. TITLE 버튼을 눌러 타이틀곡을 지정할 수 있습니다.</p><div id="tracks-container" class="track-list"></div></section></div><aside class="sticky-actions"><h3>${editing?'수정 내용 저장':'아카이브에 저장'}</h3><p>사진과 멤버·트랙 정보는 온라인 데이터베이스에 저장됩니다. 작성 중인 일부 항목은 비워 두어도 됩니다.</p><button type="submit" class="primary-btn" id="save-button">${editing?'수정 내용 저장하기':'기록 저장하기'} ↗</button><button type="button" class="secondary-btn" data-action="category" data-type="${d.type}">목록으로 돌아가기</button><div class="hint-box" style="margin-top:17px"><strong>ONLINE STORAGE</strong><br>저장 내용은 다른 기기에도 반영됩니다. 안전을 위해 정기적으로 JSON 백업을 다운로드하세요.</div></aside></div></form>`;
if(!isAlbum)renderMembers();renderTracks();}
function syncMembers(count){const d=state.draft;d.memberCount=Math.min(99,Math.max(2,Number(count)||2));d.members=(d.members||[]).slice(0,d.memberCount);while(d.members.length<d.memberCount)d.members.push(blankMember());}
function renderMembers(){
 const el=document.getElementById('members-container');if(!el)return;
 el.innerHTML=(state.draft.members||[]).map((m,i)=>{
  const url=imgURL(m.photo);

 }).join('');
}
function renderTracks(){const el=document.getElementById('tracks-container');if(!el)return;document.getElementById('track-count').textContent=state.draft.tracks.length;el.innerHTML=state.draft.tracks.map((t,i)=>`<div class="track-row"><div class="track-top"><span class="track-number">TRACK ${String(i+1).padStart(2,'0')}</span><button type="button" class="title-toggle ${t.title?'is-title':''}" data-action="mark-title" data-index="${i}" aria-pressed="${!!t.title}">${t.title?'★ TITLE TRACK':'☆ 타이틀 지정'}</button></div><div class="track-fields"><div><label>곡명</label><input data-track-index="${i}" data-track-prop="name" value="${esc(t.name)}" placeholder="곡명 입력"></div><div><label>장르</label><input data-track-index="${i}" data-track-prop="genre" value="${esc(t.genre)}" placeholder="예: Dance Pop"></div><div class="youtube"><label>YouTube 링크</label><input data-track-index="${i}" data-track-prop="youtube" type="url" value="${esc(t.youtube)}" placeholder="https://www.youtube.com/watch?v=..."></div></div></div>`).join('');}
function validVideoLink(link){if(!link.trim())return true;try{const url=new URL(link);return ['http:','https:'].includes(url.protocol)&&['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com','youtu.be','www.youtu.be','www.youtube-nocookie.com','youtube-nocookie.com'].includes(url.hostname.toLowerCase());}catch{return false;}}
async function saveForm(){if(state.saving)return;const d=state.draft;if(!d)return;const name=(d.type==='album'?d.albumName:d.groupName).trim();if(!name){toast(d.type==='album'?'앨범명을 입력하세요.':'그룹명을 입력하세요.');document.getElementById(d.type==='album'?'field-albumName':'field-groupName')?.focus();return;}
const bad=(d.tracks||[]).findIndex(t=>!validVideoLink(t.youtube||''));if(bad>=0){toast(`TRACK ${bad+1}의 유튜브 주소를 확인하세요.`);return;}
state.saving=true;const btn=document.getElementById('save-button');if(btn){btn.disabled=true;btn.textContent='클라우드에 저장하는 중…';}
try{d.updatedAt=new Date().toISOString();if(d.type!=='album')syncMembers(d.memberCount);if(!d.tracks.some(x=>x.title)&&d.tracks.length)d.tracks[0].title=true;await put(d);await reload();toast('클라우드에 저장했습니다.');showDetail(d.id);}catch(err){console.error(err);toast('저장 실패: '+(err.message||'권한과 연결을 확인하세요.'));}finally{state.saving=false;if(document.getElementById('save-button'))document.getElementById('save-button').disabled=false;}}
function metaItem(label,value){return `<div class="meta-item"><span>${label}</span><strong>${esc(value||'미입력')}</strong></div>`;}
function urlForDisplay(value){if(!validVideoLink(value))return '';try{const u=new URL(value);return u.href;}catch{return '';}}
function renderDetail(){const r=state.all.find(v=>v.id===state.recordId);if(!r){goCategory(state.category);return;}const isAlbum=r.type==='album';const primaryImage=isAlbum?r.albumCover:(r.groupPhoto||r.albumCover);const albumName=isAlbum?r.albumName:r.debutAlbumName;app.innerHTML=`<button class="back-btn" data-action="category" data-type="${r.type}">← ${meta[r.type].title} 목록</button><div class="page-top"><div><div class="eyebrow">ARCHIVED RECORD / ${meta[r.type].title}</div><h1 class="page-heading">Archive <span class="accent">Details.</span></h1></div>${state.isAdmin?`<button class="primary-btn" data-action="edit" data-id="${esc(r.id)}">✎ 기록 수정</button>`:""}</div><div class="detail-shell"><div><article class="detail-hero"><div class="detail-banner">${iconCover(primaryImage,'IDOL')}</div><div class="detail-info"><div class="eyebrow">${meta[r.type].title}</div><h2 class="detail-title">${esc(cardTitle(r))}</h2><div class="detail-sub">${esc(isAlbum?r.groupName:(r.company||'소속사 미입력'))}</div><div class="meta-grid">${isAlbum?`${metaItem('아티스트 / 그룹',r.groupName)}${metaItem('발매일',r.releaseDate?prettyDate(r.releaseDate):'미입력')}`:`${metaItem('소속사',r.company)}${metaItem('데뷔일',r.debutDate?prettyDate(r.debutDate):'미입력')}${metaItem('멤버 수',`${r.memberCount||0}명`)}${metaItem('데뷔 앨범명',albumName)}`}${metaItem('앨범 종류',r.albumType)}${metaItem('수록곡 수',`${(r.tracks||[]).length}곡`)}</div></div></article>${isAlbum?'':`<section class="data-card"><h3>멤버 정보 · ${(r.members||[]).length}명</h3><div class="member-table">${(r.members||[]).map((m,i)=>`<div class="member-pill"><div class="member-display-image">${imgURL(m.photo)?`<img src="${esc(imgURL(m.photo))}" alt="${esc(m.name||'멤버')} 사진">`:'<span>NO IMAGE</span>'}</div><div class="member-display-text"><strong>${String(i+1).padStart(2,'0')} · ${esc(m.name||'이름 미입력')}</strong><small>${esc([m.birthYear,m.nationality,m.position].filter(Boolean).join(' · ')||'추가 정보 없음')}</small></div></div>`).join('')}</div></section>`}<section class="data-card"><h3>Tracklist · ${(r.tracks||[]).length} tracks</h3>${(r.tracks||[]).map((t,i)=>`<div class="track-display"><span class="num">${String(i+1).padStart(2,'0')}</span><div class="track-info"><strong>${esc(t.name||'곡명 미입력')}${t.title?'<span class="pill">TITLE</span>':''}</strong><small>${esc(t.genre||'장르 미입력')}</small></div>${urlForDisplay(t.youtube||'')?`<a href="${esc(urlForDisplay(t.youtube))}" target="_blank" rel="noopener noreferrer">YouTube ↗</a>`:''}</div>`).join('')}</section></div><aside class="detail-secondary"><div class="eyebrow">ALBUM ARTWORK</div>${iconCover(r.albumCover,'ALBUM')}<h3>${esc(albumName||'앨범명 미입력')}</h3><p>${esc(r.albumType||'앨범 종류 미입력')}</p>${state.isAdmin?`<button class="secondary-btn" data-action="edit" data-id="${esc(r.id)}">이 기록 수정하기</button><button class="secondary-btn" data-action="delete" data-id="${esc(r.id)}" style="color:#cf6776">기록 삭제하기</button>`:""}</aside></div>`;}
async function deleteRecord(id){if(!state.isAdmin)return goLogin();const r=state.all.find(x=>x.id===id);if(!r)return;if(!confirm(`‘${cardTitle(r)||'기록'}’ 자료를 삭제할까요?\n삭제된 기록은 복구할 수 없습니다.`))return;try{await remove(id);await reload();toast('기록을 삭제했습니다.');goCategory(r.type);}catch(e){console.error(e);toast('삭제하지 못했습니다.');}}
function blobToDataURL(blob){return new Promise((resolve,reject)=>{if(!blob)return resolve(null);const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob);});}
function dataURLToBlob(url){if(!url||typeof url!=='string')return null;const m=/^data:([^;,]+)?(;base64)?,(.*)$/s.exec(url);if(!m)throw Error('이미지 데이터 형식이 잘못되었습니다.');if(!m[2])return new Blob([decodeURIComponent(m[3])],{type:m[1]||'application/octet-stream'});const b=atob(m[3]);const bytes=new Uint8Array(b.length);for(let i=0;i<b.length;i++)bytes[i]=b.charCodeAt(i);return new Blob([bytes],{type:m[1]||'application/octet-stream'});}
async function imageToDataURL(v){
 if(!v)return null;
 if(v instanceof Blob)return blobToDataURL(v);
 if(typeof v==='string'&&v.startsWith('data:'))return v;
 if(typeof v==='string'&&v.startsWith('https://')){
  const res=await fetch(v);
  if(!res.ok)throw Error('이미지를 백업하지 못했습니다: HTTP '+res.status);
  return blobToDataURL(await res.blob());
 }
 return null;
}
async function exportBackup(){
 if(!state.isAdmin)return goLogin();
 try{
  if(!state.all.length){toast('백업할 기록이 없습니다.');return;}
  toast('클라우드 사진을 포함한 백업을 생성하는 중…');
  const records=[];
  for(const r of state.all)records.push({...r,groupPhoto:await imageToDataURL(r.groupPhoto),albumCover:await imageToDataURL(r.albumCover),groupPhotoPath:null,albumCoverPath:null});
  const content={format:'idol-index-backup',version:1,exportedAt:new Date().toISOString(),records};
  const blob=new Blob([JSON.stringify(content)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`idol-index-cloud-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(`${records.length}개 기록과 사진을 백업했습니다.`);
 }catch(e){console.error(e);toast('백업 실패: '+e.message);}
}
async function importBackup(file){
 if(!state.isAdmin)return goLogin();
 if(!file||state.importing)return;
 try{
  const obj=JSON.parse(await file.text());
  if(obj.format!=='idol-index-backup'||obj.version!==1||!Array.isArray(obj.records))throw Error('원본 사이트의 JSON 백업 파일만 지원합니다.');
  if(!obj.records.length){toast('백업 파일에 기록이 없습니다.');return;}
  if(!confirm(`${obj.records.length}개 기록을 클라우드에 복원할까요?\n같은 ID는 새 내용으로 덮어씁니다. 사진도 업로드됩니다.`))return;
  state.importing=true;let n=0;
  for(const r of obj.records){
   if(!meta[r.type]||typeof r.id!=='string'||!r.id||!Array.isArray(r.tracks))continue;
   const copy={...r};
   for(const k of ['groupPhoto','albumCover']){
    copy[k]=copy[k]&&copy[k].startsWith('data:')?dataURLToBlob(copy[k]):null;
    copy[k+'Path']=null;
   }
   copy.updatedAt=new Date().toISOString();
   await put(copy);n++;
  }
  await reload();goHome();toast(`${n}개 기록을 클라우드에 복원했습니다.`);
 }catch(err){console.error(err);await reload().catch(()=>{});toast(`복원 중단: ${err.message||'백업 파일을 확인하세요.'}. 이미 업로드된 기록은 유지됩니다.`);}finally{state.importing=false;document.getElementById('import-file').value='';}
}
document.addEventListener('click',async e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action;switch(action){case'home':goHome();break;case'category':goCategory(btn.dataset.type);break;case'new':beginNew(btn.dataset.type);break;case'detail':showDetail(btn.dataset.id);break;case'edit':beginEdit(btn.dataset.id);break;case'delete':await deleteRecord(btn.dataset.id);break;case'add-track':if(state.draft.tracks.length>=100){toast('트랙은 최대 100곡까지 추가할 수 있습니다.');break;}state.draft.tracks.push(defaultTrack(1));renderTracks();break;case'remove-track':if(state.draft.tracks.length>1){const removed=state.draft.tracks.pop();if(removed.title)state.draft.tracks[0].title=true;renderTracks();}else toast('트랙은 최소 1곡이 필요합니다.');break;case'mark-title':{const i=Number(btn.dataset.index);state.draft.tracks.forEach((t,j)=>t.title=i===j);renderTracks();break;}case'export':await exportBackup();break;case'import':if(state.isAdmin)document.getElementById('import-file').click();else goLogin();break;case'login':goLogin();break;case'logout':await logout();break;}});
document.addEventListener('input',e=>{const target=e.target;if(target.id==='search-records'){state.search=target.value;renderRecordList();return;}if(!state.draft)return;if(target.hasAttribute('data-field'))state.draft[target.dataset.field]=target.value;if(target.hasAttribute('data-member-index')){const m=state.draft.members[Number(target.dataset.memberIndex)];if(m)m[target.dataset.memberProp]=target.value;}if(target.hasAttribute('data-track-index')){const t=state.draft.tracks[Number(target.dataset.trackIndex)];if(t)t[target.dataset.trackProp]=target.value;}});
document.addEventListener('change',e=>{const target=e.target;if(target.id==='import-file'){importBackup(target.files?.[0]);return;}if(!state.draft)return;if(target.dataset.action==='member-count'){if(target.value==='more')syncMembers(Math.max(13,state.draft.memberCount));else syncMembers(Number(target.value));renderForm();return;}if(target.dataset.action==='member-extra'){syncMembers(Number(target.value)>=13?Number(target.value):13);renderForm();return;}if(target.dataset.memberImageIndex!==undefined){const file=target.files?.[0];if(!file)return;if(!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type)||file.size>5*1024*1024){toast('JPG·PNG·WEBP·GIF, 5MB 이하 파일을 선택하세요.');target.value='';return;}const member=state.draft.members[Number(target.dataset.memberImageIndex)];if(!member)return;member.photo=file;const box=target.closest('.member-photo');if(box){const url=URL.createObjectURL(file);state.urls.push(url);box.querySelector('img,.member-photo-placeholder')?.remove();const img=document.createElement('img');img.src=url;img.alt='멤버 사진 미리보기';box.insertBefore(img,target);}return;}if(target.dataset.image){const file=target.files?.[0];if(!file)return;if(!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type)||file.size>5*1024*1024){toast('JPG·PNG·WEBP·GIF, 5MB 이하 파일을 선택하세요.');target.value='';return;}state.draft[target.dataset.image]=file;const old=target.closest('.upload');if(old){const prior=old.querySelector('img');if(prior?.src.startsWith('blob:'))URL.revokeObjectURL(prior.src);const url=URL.createObjectURL(file);state.urls.push(url);old.querySelector('img,.upload-label')?.remove();const img=document.createElement('img');img.src=url;img.alt='업로드한 이미지 미리보기';old.insertBefore(img,target);}}});
document.addEventListener('submit',e=>{if(e.target.id==='editor'){e.preventDefault();saveForm();}else if(e.target.id==='login-form'){e.preventDefault();loginSubmit(e.target);}});
(async()=>{
 try{
  if(!/^https:\/\/[^\s]+\.supabase\.co\/?$/.test(config.supabaseUrl||'')||!/^sb_publishable_/.test(config.supabaseKey||'')){
   throw Error('config.js에 Supabase Project URL과 Publishable key를 입력해 주세요.');
  }
  if(!window.supabase?.createClient)throw Error('Supabase 라이브러리를 불러오지 못했습니다. 인터넷 연결 또는 CDN 접근을 확인하세요.');
  client=window.supabase.createClient(config.supabaseUrl,config.supabaseKey);
  await refreshAuth();await reload();goHome();
 }catch(err){
  console.error(err);
  app.innerHTML=`<section class="section-card"><div class="eyebrow">SETUP REQUIRED</div><h1>클라우드 연결 설정이 필요합니다.</h1><p>${esc(err.message||'알 수 없는 오류')}</p><p>① Supabase SQL 실행 ② 관리자 계정 등록 ③ config.js에 Project URL · Publishable key 입력 ④ GitHub Pages에 전체 파일 업로드</p><p class="note">설정과 SQL 작성법은 함께 제공한 README.md 파일을 참고하세요.</p></section>`;
 }
})();

})();
</script>
